<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LON P2 v4 — История сделок и баланс</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #050b14;
      --surface: #0b1526;
      --border: rgba(56, 189, 248, 0.16);
      --text: #e6f1ff;
      --muted: #7da0c4;
      --cyan: #38bdf8;
      --glow: rgba(56, 189, 248, 0.22);
      --win: #10b981;
      --loss: #f43f5e;
      --draw: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top right, #0c2340 0%, var(--bg) 58%);
      color: var(--text);
      min-height: 100vh;
      padding: 14px 14px 28px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
    }
    .title { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
    .sub { font-size: 11px; color: var(--muted); }
    .btn {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #fff; border: none; border-radius: 10px;
      padding: 8px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 16px var(--glow);
    }
    .card {
      background: linear-gradient(180deg, rgba(15, 30, 54, 0.9), rgba(11, 21, 38, 0.95));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .bal-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .bal-lbl { font-size: 12px; color: var(--muted); }
    .bal-val { font-size: 26px; font-weight: 800; color: #fff; }
    .bal-meta { font-size: 12px; color: var(--cyan); font-weight: 600; }
    canvas {
      width: 100%; height: 150px; display: block;
      border-radius: 10px; background: rgba(5, 11, 20, 0.65);
    }
    .kpis {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 12px;
    }
    .kpi {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px; text-align: center;
    }
    .kpi-v { font-size: 16px; font-weight: 700; color: var(--cyan); }
    .kpi-l { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .filters {
      display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px;
    }
    .chip {
      background: var(--surface); color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      background: rgba(56, 189, 248, 0.16);
      color: var(--cyan); border-color: var(--cyan);
    }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .item-left { display: flex; flex-direction: column; gap: 3px; }
    .pair-line { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
    .tag {
      font-size: 10px; padding: 2px 6px; border-radius: 6px;
      background: rgba(56, 189, 248, 0.14); color: var(--cyan); font-weight: 700;
    }
    .meta-line { font-size: 11px; color: var(--muted); }
    .item-right { text-align: right; display: flex; flex-direction: column; gap: 3px; }
    .badge {
      font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; display: inline-block;
    }
    .WIN { background: rgba(16, 185, 129, 0.16); color: var(--win); }
    .LOSS { background: rgba(244, 63, 94, 0.16); color: var(--loss); }
    .DRAW { background: rgba(148, 163, 184, 0.16); color: var(--draw); }
    .bal-after { font-size: 12px; font-weight: 700; color: var(--text); }
    .empty { text-align: center; color: var(--muted); padding: 24px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <div class="title">LON P2 v4 · Mini App</div>
          <div class="sub" id="statusSub">Сессия 11:00–14:59 МСК · Схема #9</div>
        </div>
      </div>
      <button class="btn" onclick="loadData()">Обновить</button>
    </div>

    <div class="card">
      <div class="bal-row">
        <div>
          <div class="bal-lbl">Текущий баланс</div>
          <div class="bal-val" id="curBalance">$7.89</div>
        </div>
        <div class="bal-meta" id="peakInfo">Пик: $7.89 · DD: 0.0%</div>
      </div>
      <canvas id="eqChart" width="520" height="150"></canvas>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="kpi-v" id="winrateVal">0.0%</div>
        <div class="kpi-l">Винрейт</div>
      </div>
      <div class="kpi">
        <div class="kpi-v" id="wldVal">0 / 0 / 0</div>
        <div class="kpi-l">W / L / D</div>
      </div>
      <div class="kpi">
        <div class="kpi-v" id="tradesCountVal">0</div>
        <div class="kpi-l">Сделок в списке</div>
      </div>
    </div>

    <div class="filters">
      <button class="chip active" data-eng="ALL" onclick="setFilter('ALL', this)">Все</button>
      <button class="chip" data-eng="M3" onclick="setFilter('M3', this)">M3 (6m)</button>
      <button class="chip" data-eng="M5" onclick="setFilter('M5', this)">M5 Снайпер</button>
      <button class="chip" data-eng="M15" onclick="setFilter('M15', this)">M15 (10m)</button>
    </div>

    <div class="list" id="tradesList"></div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#050b14");
      tg.setBackgroundColor("#050b14");
    }

    const DEMO_STATE = {
      peak_balance: 9.59,
      wins: 2,
      losses: 1,
      draws: 0,
      trades: [
        { ts_msk: "2026-11-24 12:15:00", pair: "CHF/JPY", engine: "M5_FADE", exp_min: 20, direction: "PUT", entry: 189.74, exit: 189.58, outcome: "WIN", payout: 88, stake: 1.0, balance: 8.77 },
        { ts_msk: "2026-11-24 12:52:00", pair: "EUR/USD", engine: "M3_FADE", exp_min: 6, direction: "CALL", entry: 1.0948, exit: 1.0942, outcome: "LOSS", payout: 82, stake: 1.0, balance: 7.77 },
        { ts_msk: "2026-11-24 13:24:00", pair: "CHF/JPY", engine: "M5_FADE", exp_min: 20, direction: "PUT", entry: 189.69, exit: 189.51, outcome: "WIN", payout: 88, stake: 1.0, balance: 8.65 }
      ]
    };

    let currentState = DEMO_STATE;
    let activeFilter = "ALL";

    function fmtUsd(v) {
      const n = Number(v || 0);
      return "$" + n.toFixed(2);
    }

    function setFilter(eng, el) {
      activeFilter = eng;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      if (el) el.classList.add("active");
      render();
    }

    function drawChart(trades, fallbackBal) {
      const canvas = document.getElementById("eqChart");
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const pts = trades
        .map(t => Number(t.balance))
        .filter(v => Number.isFinite(v) && v > 0);

      if (pts.length < 2) {
        const b = pts.length === 1 ? pts[0] : Number(fallbackBal || 7.89);
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(16, h * 0.55);
        ctx.lineTo(w - 16, h * 0.55);
        ctx.stroke();
        ctx.fillStyle = "#7da0c4";
        ctx.font = "12px sans-serif";
        ctx.fillText("Баланс: " + fmtUsd(b) + " (кривая появится после 2+ закрытых сделок)", 16, 26);
        return;
      }

      const pad = 16;
      const minV = Math.min(...pts);
      const maxV = Math.max(...pts);
      const span = Math.max(0.05, maxV - minV);

      const coords = pts.map((val, idx) => {
        const x = pad + (idx / (pts.length - 1)) * (w - pad * 2);
        const y = h - pad - ((val - minV) / span) * (h - pad * 2);
        return [x, y];
      });

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "rgba(56, 189, 248, 0.34)");
      grad.addColorStop(1, "rgba(56, 189, 248, 0.0)");

      ctx.beginPath();
      ctx.moveTo(coords[0][0], h - pad);
      coords.forEach(([x, y]) => ctx.lineTo(x, y));
      ctx.lineTo(coords[coords.length - 1][0], h - pad);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      coords.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      coords.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#7dd3fc";
        ctx.fill();
      });
    }

    function render() {
      const st = currentState || {};
      const allTrades = Array.isArray(st.trades) ? st.trades : [];
      const filtered = activeFilter === "ALL"
        ? allTrades
        : allTrades.filter(t => String(t.engine || "").startsWith(activeFilter));

      const lastBal = allTrades.length > 0 && allTrades[allTrades.length - 1].balance != null
        ? Number(allTrades[allTrades.length - 1].balance)
        : (Number(st.current_balance || 0) > 0 ? Number(st.current_balance) : (Number(st.peak_balance || 0) > 0 ? Number(st.peak_balance) : 7.89));
      const peak = Math.max(Number(st.peak_balance || 0), lastBal);
      const dd = peak > 0 ? Math.max(0, ((peak - lastBal) / peak) * 100) : 0;

      const w = Number(st.wins || 0);
      const l = Number(st.losses || 0);
      const d = Number(st.draws || 0);
      const wr = (w + l) > 0 ? ((w / (w + l)) * 100).toFixed(1) : "0.0";

      document.getElementById("curBalance").textContent = fmtUsd(lastBal);
      document.getElementById("peakInfo").textContent = `Пик: ${fmtUsd(peak)} · DD: -${dd.toFixed(1)}%`;
      document.getElementById("winrateVal").textContent = wr + "%";
      document.getElementById("wldVal").textContent = `${w} / ${l} / ${d}`;
      document.getElementById("tradesCountVal").textContent = String(filtered.length);

      drawChart(allTrades, lastBal);

      const box = document.getElementById("tradesList");
      if (!filtered.length) {
        box.innerHTML = `<div class="empty">Закрытых сделок по выбранному фильтру пока нет.</div>`;
        return;
      }

      box.innerHTML = [...filtered].reverse().map(t => {
        const out = String(t.outcome || "DRAW");
        const dir = t.direction === "CALL" ? "CALL ▲" : "PUT ▼";
        const balTxt = t.balance != null ? fmtUsd(t.balance) : "-";
        return `
          <div class="item">
            <div class="item-left">
              <div class="pair-line">${t.pair || "-"} <span class="tag">${t.engine || ""}</span> <span class="tag">${dir}</span></div>
              <div class="meta-line">${t.ts_msk || ""} · ${t.exp_min || ""}m · Вход ${t.entry} → Выход ${t.exit}</div>
            </div>
            <div class="item-right">
              <span class="badge ${out}">${out}</span>
              <span class="bal-after">${balTxt}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadData() {
      const urls = [
        "https://raw.githubusercontent.com/Captalink/lon4-miniapp/main/state.json?t=" + Date.now(),
        "./state.json?t=" + Date.now(),
        "/api/state"
      ];
      for (const u of urls) {
        try {
          const resp = await fetch(u, { cache: "no-store" });
          if (resp.ok) {
            currentState = await resp.json();
            document.getElementById("statusSub").textContent = "Онлайн · Реальные данные бота";
            render();
            return;
          }
        } catch (e) {}
      }
      document.getElementById("statusSub").textContent = "Демо-режим (ожидание первой синхронизации)";
      render();
    }

    loadData();
  </script>
</body>
</html>
